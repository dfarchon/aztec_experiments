<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notch</title>
  <meta name="description" content="Notch is a public onchain message board on Aztec. Posts show messages, not author addresses.">
  <link rel="icon" type="image/svg+xml" href="./notch-icon.svg">
