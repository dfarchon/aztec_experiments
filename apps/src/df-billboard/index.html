<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Forest Billboard</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('df-billboard:theme') === 'light' ? 'light' : 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }</script>
</head>
<body>
  <div id="root"></div>
  <noscript>Enable JavaScript to use Billboard.</noscript>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
