<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notch</title>
    <meta
      name="description"
      content="Notch is an independent public message board on Aztec. Read freely and post with refundable stake."
    />
    <link rel="icon" type="image/svg+xml" href="./notch-icon.svg" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("df-billboard:theme") === "light"
            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to use Notch.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
